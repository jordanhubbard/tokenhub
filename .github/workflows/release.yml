name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux x86-64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          # Linux ARM64
          - runner: ubuntu-latest
            os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          # macOS Intel
          - runner: macos-13
            os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
          # macOS Apple Silicon
          - runner: macos-14
            os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_clean=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build tokenhub
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version_clean }}" \
            -o "bin/tokenhub-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}" \
            ./cmd/tokenhub

      - name: Build tokenhubctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version_clean }}" \
            -o "bin/tokenhubctl-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}" \
            ./cmd/tokenhubctl

      - name: Create tarball
        run: |
          cd bin
          tar czf "tokenhub-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            "tokenhub-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}" \
            "tokenhubctl-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          ls -lh *.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/tokenhub-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 7

  create-release-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: build-binaries
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets

          # Generate checksums
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

          # List all assets
          echo "Release assets:"
          ls -lh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          for file in *; do
            if [ "$file" != "SHA256SUMS" ]; then
              gh release upload ${{ steps.version.outputs.version }} "$file" --clobber
            fi
          done
          gh release upload ${{ steps.version.outputs.version }} SHA256SUMS --clobber

      - name: List release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ steps.version.outputs.version }} --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'
